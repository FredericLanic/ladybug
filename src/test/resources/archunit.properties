# ArchUnit (étape 5 bis) : registre des violations « gelées » (ArchitectureTest).
# Il est commité : en CI, il ne doit jamais être créé de zéro, seulement lu
# (et allégé quand une ancienne violation disparaît).
freeze.store.default.path=src/test/resources/archunit-store
freeze.store.default.allowStoreCreation=false
# Une boucle gelée est reconnue par son seul chemin (body -> engine -> body),
# pas par la liste de ses dépendances : sinon, ajouter un simple appel sur un
# lien déjà en boucle ferait croire à une nouvelle boucle.
cycles.maxNumberOfDependenciesPerEdge=0
