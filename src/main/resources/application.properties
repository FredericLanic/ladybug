# La bannière lit la version dans le manifest du jar (Implementation-Version, écrite
# par Maven) : ne pas redéfinir application.version ici (étape 2.2).
spring.banner.location=classpath:banner.txt
# Même format de log qu'avant Spring Boot (le robot et les analyses de Claude le lisent)
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger -- %msg%n
