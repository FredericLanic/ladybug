# Vérification automatique : compilation et tests (unitaires, contexte Spring,
# golden master, bot) à chaque pull request et à chaque push sur develop,
# sur les trois systèmes où Ladybug doit tourner (étape 3.5.4).
name: Build

on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  build:
    strategy:
      # un système en échec n'arrête pas les autres : on voit tout d'un coup
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: '**/pom.xml'

    # .mvn/maven.config est pris en compte automatiquement (Maven Central, sans miroir)
    - name: Build with Maven
      run: mvn -B clean verify

  # Tests de mutation (étape 3.5.5, C36) : PIT glisse de petites erreurs dans le
  # code et vérifie que les tests les détectent. Sur Ubuntu, en parallèle des tests ;
  # la construction échoue sous 60 % (seuil dans le pom).
  # ESSAI EN COURS : deux réglages comparés (A et B), un seul sera gardé.
  mutation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A-2threads-timeout2
            args: -Dpit.threads=2 -Dpit.timeoutFactor=2
          - variant: B-2threads-timeout2-sans-bot
            args: -Dpit.threads=2 -Dpit.timeoutFactor=2 -Dpit.excludedTests=com.kycox.game.testutil.BotGameTest
    name: mutation (${{ matrix.variant }})
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: '**/pom.xml'

    - name: Mutation testing with PIT
      run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage ${{ matrix.args }}

    - name: Keep the PIT report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pit-report-${{ matrix.variant }}
        path: target/pit-reports/
