# Vérification automatique : compilation (et tests, dès qu'il y en aura)
# à chaque pull request et à chaque push sur develop.
name: Build

on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: '**/pom.xml'

    # .mvn/maven.config est pris en compte automatiquement (Maven Central, sans miroir)
    - name: Build with Maven
      run: mvn -B clean verify
