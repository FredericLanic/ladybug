# Publication d'une version de Ladybug (décisions C39 à C42)
# ==================================================
# Lancement à la main, depuis l'onglet Actions (« Run workflow »), sur la branche master :
#   1. release:prepare (Maven Release Plugin) : pom en version finale, tests, commit,
#      tag vX.Y.Z, pom en version SNAPSHOT suivante, commit, push ;
#   2. reconstruction du jar depuis le tag ;
#   3. GitHub Release avec le jar en pièce jointe (page « Releases » du dépôt).
# Pas de dépôt Maven (GitHub Packages) : Ladybug est un jeu, pas une bibliothèque.
#
# « Essai à blanc » coché : tout est simulé (versions, tests, tag), rien n'est poussé ni publié.
# Possible depuis n'importe quelle branche.

name: Maven Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version à publier (ex. 0.8.0)'
        required: true
      devVersion:
        description: 'Version suivante, avec -SNAPSHOT (ex. 0.9.0-SNAPSHOT)'
        required: true
      dryRun:
        description: 'Essai à blanc : rien n''est poussé ni publié'
        type: boolean
        default: true

# Droits du jeton GitHub : pousser les commits et le tag, créer la Release
permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.releaseVersion }}
  DEV_VERSION: ${{ inputs.devVersion }}
  DRY_RUN: ${{ inputs.dryRun }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    # Garde-fous : une vraie publication part de master, avec des numéros bien formés
    - name: Check inputs
      run: |
        if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
          echo "::error::Une vraie publication se lance sur master (ici : $GITHUB_REF)."; exit 1
        fi
        echo "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
          || { echo "::error::Version à publier invalide : $RELEASE_VERSION (attendu : 0.8.0)"; exit 1; }
        echo "$DEV_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$' \
          || { echo "::error::Version suivante invalide : $DEV_VERSION (attendu : 0.9.0-SNAPSHOT)"; exit 1; }

    - uses: actions/checkout@v7

    - uses: fregante/setup-git-user@v2 # nom et e-mail Git du robot GitHub Actions pour les commits

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Prepare release
      run: >
        mvn -B release:prepare
        -DreleaseVersion=$RELEASE_VERSION
        -DdevelopmentVersion=$DEV_VERSION
        -DdryRun=$DRY_RUN
        -Dusername=$GITHUB_ACTOR
        -Dpassword=${{ secrets.GITHUB_TOKEN }}

    # Le jar publié est reconstruit depuis le tag : il correspond exactement à la version
    - name: Build jar from tag
      if: ${{ !inputs.dryRun }}
      run: |
        git checkout "v$RELEASE_VERSION"
        mvn -B clean package -DskipTests
        ls -l target/ladybug-$RELEASE_VERSION.jar

    - name: Publish GitHub Release
      if: ${{ !inputs.dryRun }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.releaseVersion }}
        name: Ladybug ${{ inputs.releaseVersion }}
        generate_release_notes: true
        files: target/ladybug-${{ inputs.releaseVersion }}.jar
